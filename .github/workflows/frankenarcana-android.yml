name: FrankenArcana — Android donor build (free, manual, no upload)

# Owner controls invocation. No push/PR/schedule triggers, release or deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chimera-free-manual-device-spike
  cancel-in-progress: false

jobs:
  build-device-spike:
    if: github.repository == 'AARMOU/arcana-chimera' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out Chimera without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 platform and build tools
        run: |
          test -n "$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" --install \
            "build-tools;35.0.0" "platforms;android-35" "platform-tools"

      - name: Install virtual framebuffer if needed
        run: |
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi

      - name: Compile Forge Android with isolated Chimera launcher
        env:
          DISPLAY: ':1'
        run: |
          Xvfb :1 -screen 0 800x600x8 >/dev/null 2>&1 &
          timeout 3000s bash scripts/build_frankenarcana.sh

      - name: Final report — no APK published or uploaded
        if: always()
        run: |
          echo "Chimera device spike CI is build-only."
          echo "The binary is NOT distributed; no GitHub artifact uploads or releases."
          echo "Arcana–Argentum repository was not used by this job."
