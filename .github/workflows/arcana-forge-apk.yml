name: Arcana + Forge APK build
# Owner (Nov 7, 2026): runs on Claude B's draft-PR pushes, free standard runner.
# Owner (Nov 7, 2026, "Don't worry about encryption"): the debug APK is uploaded as a 1-day artifact for the owner's phone.
# Chimera is public, so the artifact is visible to signed-in GitHub users until it expires.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'forge-host/src/main/java/org/arcanachimera/forgehost/ArcanaForgeHost.java'
      - 'arcana-overlay/**'
      - 'scripts/build_arcana_forge_apk.sh'
      - '.github/workflows/arcana-forge-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' > /dev/null
      - name: Build Arcana with Forge inside
        run: bash scripts/build_arcana_forge_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arcana-forge-debug-apk
          path: ${{ env.APK }}
          retention-days: 1
          if-no-files-found: error
