name: Arcana + Forge APK build
# Owner (Nov 7, 2026): runs on Claude B's draft-PR pushes, free standard runner.
# Owner (Nov 7, 2026, "Don't worry about encryption"): the debug APK is uploaded as a 1-day artifact for the owner's phone.
# Chimera is public, so the artifact is visible to signed-in GitHub users until it expires.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'forge-host/src/main/java/org/arcanachimera/forgehost/ArcanaForgeHost.java'
      - 'arcana-overlay/**'
      - 'scripts/build_arcana_forge_apk.sh'
      - '.github/workflows/arcana-forge-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' > /dev/null
      - name: Build Arcana with Forge inside
        run: bash scripts/build_arcana_forge_apk.sh
      - name: Offline source-packaging unit tests
        run: python3 -m unittest discover -s tests -p 'test_gpl_build_pair.py' -v
      - name: Pair exact patched source with APK (local evidence only)
        run: python3 scripts/gpl_build_pair.py --apk "$APK"
      - name: Enforce release hold
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("reports/gpl-release/pair-manifest.json").read_text())
          assert not m["distribution_approved"]
          assert m["apk_sha256"] and m["source_sha256"]
          print("GPL source candidate prepared; PUBLIC APK UPLOAD BLOCKED pending audit.")
          PY
      - name: Unsigned Play-identity AAB compile smoke (no key or upload)
        run: |
          python3 scripts/play_release_tools.py prepare-unsigned --gradle third_party/arcana/android/app/build.gradle.kts --version-code 999999 --version-name ci-unsigned-999999
          (cd third_party/arcana/android && ./gradlew --no-daemon --max-workers=2 :app:bundleRelease)
          test -s third_party/arcana/android/app/build/outputs/bundle/release/app-release.aab
          echo "Unsigned Play-identity AAB compiled; no signing, distribution or release authorized."
      # Deliberately no upload-artifact. PR builds are not legal releases.
      # Claude B's original draft branch and its workflow are unchanged.
