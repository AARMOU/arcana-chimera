name: Arcana + Forge APK build
# Owner (Nov 7, 2026): runs on Claude B's draft-PR pushes, free standard runner.
# Build check only: the APK is NOT uploaded. Delivery to the owner is a separate encrypted step.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'forge-host/src/main/java/org/arcanachimera/forgehost/ArcanaForgeHost.java'
      - 'arcana-overlay/**'
      - 'scripts/build_arcana_forge_apk.sh'
      - '.github/workflows/arcana-forge-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Arcana with Forge inside
        run: bash scripts/build_arcana_forge_apk.sh
