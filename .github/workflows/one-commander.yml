name: Chimera - one AI Commander game (manual only)

# An explicit manual action; NEVER triggered by push, PR, schedule or another repo.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chimera-one-commander
  cancel-in-progress: false

jobs:
  commander:
    name: Headless AI vs AI Commander smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout isolated Chimera
        uses: actions/checkout@v4

      - name: Set up Java 17 and Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Forge Commander simulation
        run: bash scripts/run_one_commander.sh

      - name: Preserve logs for independent verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-commander-evidence
          path: |
            reports/commander-*.log
            reports/commander-*.status.txt
          if-no-files-found: warn
          retention-days: 7
