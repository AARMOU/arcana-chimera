name: Forge host proof (milestone 1)
# Manual only (owner rule: no automatic runs). Free standard runner, no artifacts uploaded.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build Forge + forge-host, play one turn through Argentum-shaped messages
        run: bash scripts/forge_host_proof.sh
